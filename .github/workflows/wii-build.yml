name: Wii Bootloader CI

on:
  push:
    branches: [ "master", "main", "powerpc" ]
  pull_request:
    branches: [ "master", "main", "powerpc" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Haiku Dependencies
      run: |
        apt-get update
        apt-get install -y git nasm flex bison gawk \
                                mtools xorriso zlib1g-dev \
                                mkisofs python3 wget libzstd-dev \
                                u-boot-tools xattr build-essential

    - name: Download Buildtools
      run: |
        cd ..
        git clone https://review.haiku-os.org/buildtools.git
        cd buildtools/jam
        make
        ./jam0 install

    - name: Configure Haiku for PowerPC
      run: |
        mkdir -p generated.ppc
        cd generated.ppc
        ../configure --cross-tools-source ../../buildtools --build-cross-tools ppc

    - name: Build Wii Bootloader
      run: |
        cd generated.ppc
        jam -q boot_loader_wii
        elf2dol objects/haiku/powerpc/release/system/boot/boot_loader_wii boot.dol

    - name: Build Haiku Root Image
      run: |
        cd generated.ppc
        jam -q @image

    - name: Package Wii Release
      run: |
        ./wii-install-scripts/package_wii_release.sh generated.ppc/boot.dol generated.ppc/haiku.img

    - name: Upload Wii Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: haiku-wii-release
        path: wii_sd_card_release/

